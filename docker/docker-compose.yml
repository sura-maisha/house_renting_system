services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rental_php
    ports:
      - "8080:80"
    volumes:
      - ../:/var/www/html
      - ./apache-config.conf:/etc/apache2/sites-available/000-default.conf
    depends_on:
      - mysql
    command: >
      bash -c "a2enmod rewrite && 
      apache2-foreground"

  mysql:
    image: mysql:8.0
    container_name: rental_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: rental_db
      MYSQL_USER: rental_user
      MYSQL_PASSWORD: rental_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  mysql_data:

